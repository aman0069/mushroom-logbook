name: "Cordyceps Lab Console (F43 SOP Suite)"
description: "Local-first Cordyceps militaris (Agripie F43) cultivation logbook, SOP register suite, QR label generator, and Home Assistant environmental tracker."
version: "1.3.1"
slug: "cordyceps_lab_console"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 3001
panel_icon: "mdi:mushroom-outline"
panel_title: "Cordyceps Lab"
homeassistant_api: true
map:
  - data:rw
options:
  cleanroom_temp_entity: "sensor.cordyceps_cleanroom_temperature"
  dark_room_temp_entity: "sensor.cordyceps_dark_room_temperature"
  dark_room_rh_entity: "sensor.cordyceps_dark_room_humidity"
  fruiting_temp_entity: "sensor.cordyceps_fruiting_room_temperature"
  fruiting_rh_entity: "sensor.cordyceps_fruiting_room_humidity"
  fruiting_co2_entity: "sensor.cordyceps_fruiting_room_co2"
  fruiting_lux_entity: "sensor.cordyceps_fruiting_room_illuminance"
schema:
  cleanroom_temp_entity: str?
  dark_room_temp_entity: str?
  dark_room_rh_entity: str?
  fruiting_temp_entity: str?
  fruiting_rh_entity: str?
  fruiting_co2_entity: str?
  fruiting_lux_entity: str?
